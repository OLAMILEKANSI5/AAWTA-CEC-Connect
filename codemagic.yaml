workflows:
  ios-capacitor:
    name: AAWTA iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: aawta_app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.aawta.mobile
      vars:
        BUNDLE_ID: org.aawta.mobile
        REACT_APP_BACKEND_URL: https://ambassador-hub-29.emergent.host
        APP_STORE_APPLE_ID: 6822393242
        XCODE_WORKSPACE: frontend/ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          yarn install
      - name: Build web app and sync Capacitor
        script: |
          cd frontend
          yarn build
          npx cap sync ios
      - name: Set build number from latest TestFlight build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEW=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST -> using build number $NEW"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" "$CM_BUILD_DIR/frontend/ios/App/App.xcodeproj/project.pbxproj"
          grep CURRENT_PROJECT_VERSION "$CM_BUILD_DIR/frontend/ios/App/App.xcodeproj/project.pbxproj"
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
